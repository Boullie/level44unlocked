<!doctype html><html lang="nl-BE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Level 44 — Animatiecontrole</title><style>body{margin:0;background:#10051e;color:white;font:16px system-ui,sans-serif}header{padding:20px 4vw;background:#281047;position:sticky;top:0;z-index:2}h1{margin:0 0 8px;color:#ffe477}p{margin:6px 0}.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}select,button{padding:12px;background:#41136b;color:white;border:2px solid #a56fff;border-radius:8px;font:inherit}button{cursor:pointer}main{max-width:1200px;margin:auto;padding:20px}iframe{width:100%;aspect-ratio:16/9;border:4px solid #48f6ed;border-radius:12px;background:black}.variants{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px;margin-top:20px}.variants button{font-weight:bold}.variants button.selected{background:#ffe477;color:#160725;border-color:#ffe477}.info{color:#d9c8f4}a{color:#48f6ed}</style></head><body><header><h1>🎮 Animatiecontrole</h1><p>Kies een knop en variant. De nummers staan alleen hier, niet op de Party TV.</p><div class="controls"><label>Power-up <select id="effect"></select></label><button id="previous">← Vorige</button><button id="next">Volgende →</button><button id="replay">↻ Herladen</button></div></header><main><h2 id="selection"></h2><iframe id="screen" title="Voorbeeld animatie" loading="eager"></iframe><p class="info">Geluidloos voorbeeld. Elke animatie loopt circa vier seconden; druk op Herladen om opnieuw te kijken.</p><div class="variants" id="variants"></div><p><a href="/party/">Terug naar Party TV</a></p></main><script>const types=[['confetti','🎊 Confetti'],['cheer','📣 Applaus'],['dance','🪩 Dance'],['levelup','⬆️ Level Up'],['heart','💖 Love'],['boss','👾 Boss Battle'],['fireworks','🎆 Fireworks'],['laser','⚡ Laser Show'],['jackpot','🎰 Jackpot'],['glitch','📺 Glitch']];const select=document.getElementById('effect');types.forEach(([v,t])=>select.add(new Option(t,v)));let variant=0;function show(){const name=select.value;document.getElementById('selection').textContent=types.find(x=>x[0]===name)[1]+' — variant '+(variant+1)+' / 20';document.getElementById('screen').src='/party/?preview=1&effect='+encodeURIComponent(name)+'&variant='+variant+'&reload='+Date.now();document.getElementById('variants').innerHTML='';for(let i=0;i<20;i++){const b=document.createElement('button');b.textContent='Variant '+(i+1);b.className=i===variant?'selected':'';b.onclick=()=>{variant=i;show()};document.getElementById('variants').appendChild(b)}}select.onchange=()=>{variant=0;show()};document.getElementById('previous').onclick=()=>{variant=(variant+19)%20;show()};document.getElementById('next').onclick=()=>{variant=(variant+1)%20;show()};document.getElementById('replay').onclick=show;show();</script></body></html>
