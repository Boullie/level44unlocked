<!doctype html><html lang="nl-BE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Spotify verbinden — Level 44</title><style>body{min-height:100vh;margin:0;display:grid;place-items:center;background:radial-gradient(circle at top,#382052,#10071e);color:white;font:17px system-ui,sans-serif}.card{width:min(560px,88vw);background:#201135;border:2px solid #1db954;border-radius:18px;padding:32px;text-align:center;box-shadow:0 0 40px #1db95433}h1{font-size:clamp(24px,5vw,36px)}p{line-height:1.6}a{display:inline-block;padding:13px 18px;border-radius:9px;background:#1db954;color:#071d10;font-weight:bold;text-decoration:none;margin:8px}.secondary{background:#44345d;color:white}</style></head><body><main class="card"><div style="font-size:58px" id="symbol">♫</div><h1 id="title">Spotify-koppeling</h1><p id="details">Resultaat wordt gecontroleerd…</p><p><a href="/party/">Open Party TV</a><a class="secondary" href="/dashboard/">Privédashboard</a></p></main><script>const status=new URLSearchParams(location.search).get('result');const success=status==='connected';document.getElementById('symbol').textContent=success?'✓':'!';document.getElementById('title').textContent=success?'Spotify is verbonden!':'Spotify-koppeling niet voltooid';const messages={'error':'De aanmelding is mislukt of geweigerd. Probeer het opnieuw via je privédashboard.','invalid':'De beveiligingscontrole van de aanmelding is mislukt. Start opnieuw vanuit je privédashboard.','expired':'De aanmeldingspoging is verlopen. Start opnieuw vanuit je privédashboard.','token-error':'Spotify heeft de koppeling geweigerd. Controleer de Redirect URI in je Spotify-app.','missing-token':'Spotify heeft geen blijvende toegang verleend. Probeer de koppeling opnieuw.'};document.getElementById('details').textContent=success?'De koppeling is opgeslagen. Start muziek op je iPhone en open de Party TV. De titel en artiest verschijnen automatisch, zonder geluid op het TV-scherm.':messages[status]||'De koppeling kon niet worden opgeslagen. Probeer het opnieuw via het privédashboard.';</script></body></html>
