<!doctype html><html lang="nl-BE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Level 44 — Controller</title><style>*{box-sizing:border-box}body{background:linear-gradient(145deg,#15092e,#36115e);color:white;font:17px system-ui,sans-serif;margin:0;min-height:100vh}main{max-width:600px;margin:auto;padding:25px}h1{color:#ffe46b;text-shadow:3px 3px #ec3f9b}section{border:2px solid #a37dff;background:#210f42;border-radius:18px;padding:18px;margin:20px 0}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}button{background:#7539e9;border:0;color:#fff;padding:16px;border-radius:12px;font-weight:800;font-size:16px;cursor:pointer}button:disabled{opacity:.55}input,textarea{width:100%;padding:12px;margin:8px 0 14px;border-radius:8px;border:0;font:inherit}textarea{min-height:100px}label{display:block}small{color:#d5c7ef}#status{min-height:30px;color:#ffe46b}</style></head><body><main><h1>🎮 LEVEL 44<br>PARTY CONTROLLER</h1><p>Jij bestuurt mee de Party TV. Kies een power-up of stuur een boodschap!</p><section><h2>⚡ Instant power-ups</h2><div class="actions"><button data-action="confetti">🎊 Confetti</button><button data-action="cheer">📣 Applaus</button><button data-action="dance">🪩 Dance mode</button><button data-action="levelup">⬆️ Level up</button><button data-action="heart">💖 Love</button><button data-action="boss">👾 Boss battle</button></div></section><section><h2>💬 Bericht naar de TV</h2><p><small>Je bericht verschijnt pas na goedkeuring door de organisator. Vermeld geen gevoelige gegevens.</small></p><label>Je naam <input id="name" maxlength="32" placeholder="Player name"></label><label>Je boodschap <textarea id="message" maxlength="180" placeholder="Happy level 44!"></textarea></label><button id="send">📨 Verstuur bericht</button></section><p id="status" role="status" aria-live="polite"></p></main><script>
'use strict';const status=document.getElementById('status');let busy=false;
async function send(kind,value){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);status.textContent='Versturen…';try{const r=await fetch('/.netlify/functions/party',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({op:'send',kind,value,name:document.getElementById('name').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Niet gelukt');status.textContent=kind==='message'?'📨 Verzonden! Wacht op goedkeuring.':'🎮 Power-up geactiveerd!';if(kind==='message')document.getElementById('message').value=''}catch(e){status.textContent='⚠️ '+e.message}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>send('action',b.dataset.action));document.getElementById('send').onclick=()=>send('message',document.getElementById('message').value);
</script></body></html>
