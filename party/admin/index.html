<!doctype html><html lang="nl-BE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Level 44 — Message Moderation</title><style>body{font:16px system-ui,sans-serif;background:#170a32;color:#fff;margin:0}main{max-width:760px;margin:40px auto;padding:20px}article{background:#31165c;border:1px solid #9067db;border-radius:15px;padding:18px;margin:15px 0;overflow-wrap:anywhere}button{border:0;border-radius:10px;padding:12px 18px;background:#7041d8;color:#fff;cursor:pointer;margin-right:10px}.reject{background:#934265}#status{color:#ffe46b}a{color:#85ffff}</style><script src="https://accounts.google.com/gsi/client" async defer></script></head><body><main><h1>🛡️ Level 44 — Moderatie</h1><p>Alleen het ingestelde Google-adminaccount mag berichten goedkeuren. <a href="/dashboard/">Terug naar dashboard</a></p><div id="login"></div><p id="status" role="status"></p><div id="pending"></div></main><script>
'use strict';let token='';
const status=document.getElementById('status'),root=document.getElementById('pending');
async function api(command,id){const r=await fetch('/.netlify/functions/party',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({op:'admin',command,id,idToken:token}),cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'Niet gelukt');return d}
async function refresh(){if(!token)return;try{const d=await api('list');root.replaceChildren();status.textContent=d.pending.length+' bericht(en) wachten op goedkeuring';for(const item of d.pending){const card=document.createElement('article'),h=document.createElement('h3'),p=document.createElement('p');h.textContent=item.name;p.textContent=item.value;card.append(h,p);for(const [command,label] of [['approve','✅ Goedkeuren'],['reject','🗑️ Weigeren']]){const b=document.createElement('button');b.textContent=label;if(command==='reject')b.className='reject';b.onclick=async()=>{b.disabled=true;try{await api(command,item.id);await refresh()}catch(e){status.textContent=e.message;b.disabled=false}};card.appendChild(b)}root.appendChild(card)}}catch(e){status.textContent='⚠️ '+e.message}}
async function init(){try{const r=await fetch('/.netlify/functions/rsvp-dashboard-config',{cache:'no-store'});const d=await r.json();if(!r.ok||!d.clientId)throw Error('Google-login niet geconfigureerd');google.accounts.id.initialize({client_id:d.clientId,callback:x=>{token=x.credential;document.getElementById('login').hidden=true;refresh()},auto_select:false});google.accounts.id.renderButton(document.getElementById('login'),{theme:'outline',size:'large'})}catch(e){status.textContent=e.message}}
window.addEventListener('load',()=>{let n=0;const wait=()=>window.google?.accounts?.id?init():n++<40?setTimeout(wait,250):status.textContent='Google-login kon niet laden';wait()});setInterval(refresh,7000);
</script></body></html>
