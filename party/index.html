<!doctype html>
<html lang="nl-BE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Level 44 — Party TV</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;600;700&display=swap');
:root{--pink:#ff4da6;--cyan:#48f6ed;--yellow:#ffe477;--violet:#8e54ff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#09041c;color:#fff;font-family:'Space Grotesk',system-ui,sans-serif}body:before{content:"";position:fixed;inset:0;z-index:8;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,#0002 4px 5px);opacity:.45}.space{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 20%,#4c187b 0%,#1b0a3b 48%,#08051b 90%)}.space:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 2px),radial-gradient(#56faff 1px,transparent 2px);background-size:83px 83px,137px 137px;background-position:0 0,30px 50px;opacity:.55;animation:star 45s linear infinite}@keyframes star{to{background-position:600px 300px,-300px 200px}}.sun{position:absolute;left:50%;top:30%;width:48vmin;height:48vmin;border-radius:50%;transform:translate(-50%,-50%);background:linear-gradient(#ffb661,#ff4caa 65%,#5a1c8c);opacity:.25;filter:blur(5px)}.gridfloor{position:absolute;left:-50%;right:-50%;bottom:-45%;height:85%;background:linear-gradient(#fc51c7 1px,transparent 1px),linear-gradient(90deg,#fc51c7 1px,transparent 1px);background-size:7vmin 7vmin;transform:perspective(360px) rotateX(67deg);opacity:.23;animation:floor 10s linear infinite}@keyframes floor{to{background-position:0 7vmin}}.shell{position:relative;height:100dvh;min-height:540px;display:grid;grid-template-rows:auto 1fr auto;padding:3vh 4vw 3.5vh;text-align:center}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;font:clamp(9px,1vw,13px) 'Press Start 2P',monospace;color:var(--cyan);letter-spacing:1px}.online{color:#8cffbc}.mainstage{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:clamp(12px,2vh,26px);padding-bottom:3vh}.eyebrow{font:clamp(11px,1.35vw,19px) 'Press Start 2P',monospace;color:var(--yellow);letter-spacing:.12em;text-shadow:0 0 18px #ffd35b8a;animation:blink 2s steps(2) infinite}@keyframes blink{50%{opacity:.55}}h1{font:clamp(38px,7.2vw,120px)/1.15 'Press Start 2P',monospace;margin:0;letter-spacing:-.05em;color:#fff;text-shadow:5px 5px 0 #fb3699,-5px -5px 0 #30d7f3,0 0 40px #ec2dff8c;filter:drop-shadow(0 0 16px #a54dff6b)}h1 span{color:var(--yellow)}.subtitle{font:clamp(12px,1.65vw,24px) 'Press Start 2P',monospace;color:var(--cyan);text-shadow:0 0 15px #45f6ec99;line-height:1.7}.feed{width:min(760px,70vw);border:2px solid #aa6bff;background:#120a2fd9;box-shadow:0 0 0 5px #28134b,0 0 35px #a653ff44;border-radius:10px;padding:14px 22px}.feed .tag{font:clamp(9px,1vw,13px) 'Press Start 2P',monospace;color:var(--yellow)}#message{font-size:clamp(16px,2vw,27px);font-weight:700;overflow-wrap:anywhere;min-height:1.4em;margin:12px 0 3px}.footer{display:flex;justify-content:center;align-items:center;gap:22px}.qrframe{background:white;border:5px solid var(--cyan);border-radius:10px;padding:7px;box-shadow:0 0 25px #45f6ec77}.qr{display:block;width:clamp(90px,10vw,155px);height:clamp(90px,10vw,155px)}.join{text-align:left}.join .tag{font:clamp(12px,1.6vw,22px) 'Press Start 2P',monospace;color:var(--yellow)}.join p{font-size:clamp(14px,1.6vw,23px);margin:12px 0 3px}.join small{font-size:clamp(11px,1.1vw,16px);color:#c5b4ed;overflow-wrap:anywhere}.overlay{position:fixed;inset:0;z-index:12;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0}.overlay.show{opacity:1}.effect-card{max-width:86vw;min-width:min(680px,80vw);padding:5vh 5vw;background:#100727f2;border:5px solid var(--cyan);box-shadow:0 0 0 10px #12062ad9,0 0 100px var(--pink),inset 0 0 60px #8b41ff4d;text-align:center;transform:scale(.5) rotate(-5deg)}.show .effect-card{animation:entrance 3.4s cubic-bezier(.2,1,.3,1) both}@keyframes entrance{0%{transform:scale(.2) rotate(-9deg);opacity:0}14%{transform:scale(1.15) rotate(2deg);opacity:1}23%,76%{transform:scale(1) rotate(0);opacity:1}100%{transform:scale(1.4);opacity:0}}.effect-icon{font-size:clamp(70px,12vw,190px);line-height:1.3;filter:drop-shadow(0 0 25px var(--cyan))}.effect-title{font:clamp(17px,3vw,45px)/1.6 'Press Start 2P',monospace;color:var(--yellow);text-shadow:4px 4px var(--pink)}.effect-sub{font:clamp(12px,1.5vw,20px) 'Press Start 2P',monospace;color:var(--cyan);margin-top:15px}.particles{position:fixed;inset:0;pointer-events:none;z-index:13;overflow:hidden}.particle{position:absolute;top:-10%;width:13px;height:20px;animation:fall 3.8s linear forwards}@keyframes fall{to{transform:translate(var(--drift),115vh) rotate(900deg);opacity:0}}.emoji-particle{font-size:clamp(24px,4vw,56px);width:auto;height:auto;animation:float 3.5s ease-out forwards}@keyframes float{0%{transform:translateY(100vh) scale(.5);opacity:0}25%{opacity:1}100%{transform:translateY(-30vh) rotate(25deg) scale(1.4);opacity:0}}.flash{position:fixed;inset:0;z-index:11;pointer-events:none;animation:flash .8s ease-out forwards}@keyframes flash{0%{background:#fff;opacity:.8}100%{background:#fff;opacity:0}}.shake{animation:shake .5s linear}@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-12px,6px)}40%{transform:translate(10px,-8px)}60%{transform:translate(-9px,-5px)}80%{transform:translate(8px,7px)}}.dance .space{animation:hue 1s linear infinite}@keyframes hue{to{filter:hue-rotate(360deg)}}.heart-mode .sun{background:#ff4da6;opacity:.65}.boss-mode .space{filter:hue-rotate(120deg)}.toast{position:fixed;z-index:15;top:8vh;left:50%;transform:translateX(-50%);padding:15px 24px;border:3px solid var(--yellow);background:#210e48;box-shadow:0 0 30px #f6d54e99;font:clamp(12px,1.5vw,20px) 'Press Start 2P',monospace;color:var(--yellow);text-align:center;max-width:85vw;overflow-wrap:anywhere;opacity:0;transition:opacity .25s}.toast.visible{opacity:1}@media(max-height:730px){.shell{padding:2vh 3vw}.mainstage{gap:10px}h1{font-size:clamp(32px,6vw,85px)}.feed{padding:8px 14px}.qr{width:90px;height:90px}}@media(max-width:650px){.shell{min-height:0}.topbar{font-size:8px}.feed{width:94vw}.footer{gap:10px}.join small{display:none}.qr{width:85px;height:85px}.effect-card{min-width:85vw}}@media(prefers-reduced-motion:reduce){.space:before,.gridfloor,.eyebrow,.dance .space{animation:none}.show .effect-card{animation:none;transform:none}.particle{animation-duration:.1s}}
</style><style>
/* Distinct arcade scenes */
#scene{position:fixed;inset:0;z-index:12;pointer-events:none;display:none;align-items:center;justify-content:center;overflow:hidden}#scene.active{display:flex}#scene .scene-inner{width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;text-align:center}#scene .scene-title{font:clamp(20px,4vw,62px)/1.5 'Press Start 2P',monospace;z-index:2;text-shadow:5px 5px #000,0 0 35px currentColor;padding:0 5vw}#scene .scene-note{font:clamp(12px,1.6vw,23px) 'Press Start 2P',monospace;margin-top:2vh;z-index:2}#scene .scene-symbol{font-size:clamp(90px,17vw,240px);z-index:2}
#scene.confetti-scene{background:radial-gradient(circle,#ffdf55bb,#fb249955 40%,#260b50b8)}#scene.confetti-scene .scene-title{color:#fff;animation:confettiZoom 2.7s ease-out both}@keyframes confettiZoom{0%{transform:scale(.1) rotate(-20deg)}25%{transform:scale(1.2) rotate(5deg)}40%,85%{transform:scale(1)}100%{transform:scale(1.5);opacity:0}}
#scene.cheer-scene{background:linear-gradient(#08182cf2,#0c5947e8)}#scene.cheer-scene .scene-title{color:#ffe477;animation:cheerBounce .45s ease-in-out infinite alternate}@keyframes cheerBounce{to{transform:translateY(-25px) scale(1.08)}}.crowd{position:absolute;bottom:-4vh;width:110%;font-size:clamp(50px,9vw,130px);letter-spacing:1vw;animation:crowdMove .35s ease-in-out infinite alternate}@keyframes crowdMove{to{transform:translateY(-28px)}}.cheer-beam{position:absolute;top:-50%;width:16vw;height:170vh;background:#fff3a033;filter:blur(12px);transform-origin:top center;animation:beam 1.4s ease-in-out infinite alternate}@keyframes beam{to{transform:rotate(35deg)}}
#scene.dance-scene{background:#100326f5}#scene.dance-scene .scene-title{color:#48f6ed;animation:danceTilt .5s steps(2) infinite}@keyframes danceTilt{50%{transform:rotate(-7deg) scale(1.12)}}.disco{position:absolute;top:5%;font-size:clamp(90px,16vw,230px);animation:discoSpin 2s linear infinite}@keyframes discoSpin{to{transform:rotate(360deg)}}.dancefloor{position:absolute;bottom:-30%;left:-30%;width:160%;height:85%;background:conic-gradient(from 45deg,#ff4da6 0 25%,#48f6ed 0 50%,#ffe477 0 75%,#8e54ff 0);background-size:12vw 12vw;transform:perspective(350px) rotateX(60deg);animation:floorShift .5s steps(2) infinite;opacity:.65}@keyframes floorShift{to{background-position:12vw 12vw}}
#scene.level-scene{background:radial-gradient(circle,#143d4bf5,#09041cf9)}#scene.level-scene .scene-title{color:#ffe477}.xp-track{width:min(760px,80vw);height:clamp(28px,5vw,65px);border:5px solid #fff;background:#150a2e;margin:5vh 0;box-shadow:0 0 30px #48f6ed}.xp-fill{height:100%;background:repeating-linear-gradient(90deg,#48f6ed 0 35px,#22bdb8 35px 42px);animation:xpFill 2.2s ease-out both}@keyframes xpFill{from{width:0}to{width:100%}}.level-number{font:clamp(70px,14vw,200px) 'Press Start 2P',monospace;color:#fff;animation:levelRise 2.5s ease-out both}@keyframes levelRise{0%{transform:translateY(60vh);opacity:0}45%,80%{transform:translateY(0);opacity:1}100%{transform:scale(1.5);opacity:0}}
#scene.heart-scene{background:radial-gradient(circle,#8e165fdd,#2b0b42f5)}#scene.heart-scene .scene-title{color:#ffb5df;animation:heartbeat .8s ease-in-out infinite}@keyframes heartbeat{0%,100%{transform:scale(1)}25%{transform:scale(1.15)}45%{transform:scale(1.04)}65%{transform:scale(1.2)}}.heart-halo{position:absolute;width:50vmin;height:50vmin;border:6px solid #ff8ccf;border-radius:50%;box-shadow:0 0 90px #ff4da6;animation:heartHalo 2s ease-out infinite}@keyframes heartHalo{to{transform:scale(2.6);opacity:0}}
#scene.boss-scene{background:#06010afa;animation:bossFlicker .16s steps(2) infinite}@keyframes bossFlicker{50%{background:#340007fa}}#scene.boss-scene .scene-title{color:#ff3636;animation:bossGlitch .18s steps(2) infinite}@keyframes bossGlitch{50%{transform:translate(12px,-6px);text-shadow:-8px 0 #48f6ed,8px 0 #ff4da6}}.boss-monster{font-size:clamp(110px,19vw,280px);filter:drop-shadow(0 0 35px red);animation:bossAttack 2.7s ease-in both}@keyframes bossAttack{0%{transform:scale(.15)}60%{transform:scale(1)}85%{transform:scale(1.5)}100%{transform:scale(3);opacity:0}}.boss-hp{width:min(650px,80vw);height:35px;border:4px solid #fff;background:#410000;margin-top:4vh}.boss-hp:after{content:'';display:block;background:#ff3030;height:100%;animation:bossHp 2.8s linear both}@keyframes bossHp{from{width:100%}to{width:12%}}
#message{transition:opacity .3s,transform .3s}#message.swap{opacity:0;transform:translateY(10px)}
@media(prefers-reduced-motion:reduce){#scene *{animation:none!important}}
</style></head><body><div class="space"><div class="sun"></div><div class="gridfloor"></div></div><div class="particles" id="particles"></div>
<div class="shell" id="shell"><header class="topbar"><span>★ LEVEL 44 • PARTY ARCADE ★</span><span id="connection">● CONNECTING…</span></header><main class="mainstage"><div class="eyebrow">★ ACHIEVEMENT UNLOCKED ★</div><h1>LEVEL <span>44</span><br>UNLOCKED!</h1><div class="subtitle" id="headline">INSERT CAKE TO CONTINUE</div><section class="feed"><div class="tag">▸ PARTY MESSAGE FEED ◂</div><p id="message">READY PLAYER 44?</p></section></main><footer class="footer"><div class="qrframe"><img class="qr" id="qr" alt="QR-code voor de Party Controller"></div><div class="join"><div class="tag">SCAN &amp; PLAY</div><p>📱 Pak je gsm. Unlock de party!</p><small>level44unlocked.netlify.app/party/play/</small></div></footer></div>
<div class="overlay" id="overlay" aria-live="polite"><div class="effect-card"><div class="effect-icon" id="effectIcon"></div><div class="effect-title" id="effectTitle"></div><div class="effect-sub" id="effectSub"></div></div></div><div class="toast" id="toast"></div><div id="scene" aria-live="polite"></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const playUrl=location.origin+'/party/play/';
$('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=240x240&data='+encodeURIComponent(playUrl);
const presets={
 confetti:['🎊','CONFETTI COMBO!','+100 PARTY POINTS'],
 cheer:['📣','CROWD GOES WILD!','MAXIMUM HYPE'],
 dance:['🪩','DANCE MODE!','EVERYBODY MOVE'],
 levelup:['⬆️','LEVEL UP!','NEW ACHIEVEMENT'],
 heart:['💖','BONUS LOVE!','HEARTS +44'],
 boss:['👾','BOSS BATTLE!','FINAL LEVEL INCOMING']
};
let seen=new Set(),initialized=false,lastMessage='',effectQueue=[],playing=false,headlineIndex=0,messageUntil=0;
const headlines=['INSERT CAKE TO CONTINUE','44 YEARS OF EXPERIENCE','NO EXTRA LIVES NEEDED','PRESS START TO PARTY','HIGH SCORE: GOOD VIBES'];
function particles(mode){
 const root=$('particles'),emojis=mode==='heart'?['💖','💜','💗']:mode==='cheer'?['👏','⭐','🙌']:mode==='dance'?['🪩','🎵','🎶']:mode==='boss'?['👾','⚡','💥']:null;
 const count=mode==='confetti'?115:mode==='levelup'?95:45;
 for(let i=0;i<count;i++){const p=document.createElement('span');p.className='particle'+(emojis?' emoji-particle':'');p.style.left=Math.random()*100+'%';p.style.animationDelay=Math.random()*.65+'s';p.style.animationDuration=(2.5+Math.random()*1.5)+'s';p.style.setProperty('--drift',(Math.random()*240-120)+'px');if(emojis){p.textContent=emojis[i%emojis.length]}else{p.style.background=['#ff4da6','#48f6ed','#ffe477','#a96bff','#fff'][i%5];p.style.width=(8+Math.random()*13)+'px'}root.appendChild(p);setTimeout(()=>p.remove(),5000)}
}
const messageCounts=new Map(),messagePool=new Map();
let currentMessageId='',messageRotationTimer=null;
function sceneMarkup(name){
 switch(name){
 case 'confetti':return '<div class="scene-inner"><div class="scene-symbol">🎊</div><div class="scene-title">CONFETTI COMBO!</div><div class="scene-note">+100 PARTY POINTS</div></div>';
 case 'cheer':return '<div class="scene-inner"><div class="cheer-beam" style="left:15%"></div><div class="cheer-beam" style="right:15%;animation-delay:-.7s"></div><div class="scene-symbol">📣</div><div class="scene-title">MAKE SOME NOISE!</div><div class="scene-note">CROWD GOES WILD</div><div class="crowd">🙌 🙌 🙌 🙌 🙌 🙌</div></div>';
 case 'dance':return '<div class="scene-inner"><div class="dancefloor"></div><div class="disco">🪩</div><div class="scene-title" style="margin-top:12vh">DANCE MODE!</div><div class="scene-note">♪ EVERYBODY MOVE ♪</div></div>';
 case 'levelup':return '<div class="scene-inner"><div class="level-number">44</div><div class="xp-track"><div class="xp-fill"></div></div><div class="scene-title">LEVEL UP!</div><div class="scene-note">XP BAR FULL</div></div>';
 case 'heart':return '<div class="scene-inner"><div class="heart-halo"></div><div class="scene-symbol">💖</div><div class="scene-title">LOVE UNLOCKED!</div><div class="scene-note">+44 HEARTS</div></div>';
 case 'boss':return '<div class="scene-inner"><div class="scene-title">⚠ BOSS BATTLE ⚠</div><div class="boss-monster">👾</div><div class="boss-hp"></div><div class="scene-note">FINAL LEVEL!</div></div>';
 default:return '<div class="scene-inner"><div class="scene-title">BONUS!</div></div>';
 }
}
function runNext(){
 if(playing||!effectQueue.length)return;
 playing=true;const name=effectQueue.shift(),scene=$('scene');
 scene.className=name+'-scene active';scene.innerHTML=sceneMarkup(name);
 if(name==='confetti')particles('confetti');
 if(name==='cheer'||name==='heart'||name==='dance')particles(name);
 if(name==='levelup'){const flash=document.createElement('div');flash.className='flash';document.body.appendChild(flash);setTimeout(()=>flash.remove(),900)}
 if(name==='boss')$('shell').classList.add('shake');
 setTimeout(()=>{scene.className='';scene.replaceChildren();$('shell').classList.remove('shake');playing=false;runNext()},3300);
}
function refreshMessages(messages){
 // Keep up to 30 approved messages; each message can be shown at most five times.
 const incoming=new Set();
 for(const msg of messages){if(!msg||typeof msg.id!=='string')continue;incoming.add(msg.id);if(!messageCounts.has(msg.id))messageCounts.set(msg.id,0);messagePool.set(msg.id,msg)}
 for(const id of messagePool.keys()){if(!incoming.has(id)){messagePool.delete(id);messageCounts.delete(id)}}
}
function rotateMessage(){
 const available=[...messagePool.values()].filter(m=>(messageCounts.get(m.id)||0)<5);
 if(!available.length){if(currentMessageId){currentMessageId='';$('message').textContent='READY PLAYER 44?';$('headline').textContent='INSERT CAKE TO CONTINUE'}return}
 const next=available.find(m=>m.id!==currentMessageId)||available[0];
 currentMessageId=next.id;messageCounts.set(next.id,(messageCounts.get(next.id)||0)+1);
 const node=$('message');node.classList.add('swap');
 setTimeout(()=>{node.textContent='💬 '+next.name+': '+next.value;node.classList.remove('swap')},300);
 $('headline').textContent='MESSAGE UNLOCKED!';messageUntil=Date.now()+7500;
 if(messageCounts.get(next.id)===1){const toast=$('toast');toast.textContent='★ NEW MESSAGE FROM '+next.name.toUpperCase()+' ★';toast.classList.add('visible');setTimeout(()=>toast.classList.remove('visible'),3000)}
}
messageRotationTimer=setInterval(rotateMessage,8000);
async function poll(){
 try{
  const r=await fetch('/.netlify/functions/party',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({op:'feed'}),cache:'no-store'});
  if(!r.ok)throw Error('HTTP '+r.status);
  const data=await r.json();$('connection').textContent='● PARTY ONLINE';$('connection').classList.add('online');
  const events=Array.isArray(data.events)?data.events:[];
  if(!initialized){for(const event of events)seen.add(event.id);initialized=true}
  else{for(const event of events){if(!seen.has(event.id)){seen.add(event.id);effectQueue.push(event.value)}}runNext()}
  if(seen.size>250)seen=new Set(events.map(x=>x.id));
  refreshMessages(Array.isArray(data.messages)?data.messages:[]);if(!currentMessageId&&messagePool.size)rotateMessage()
 }catch(e){$('connection').textContent='● RECONNECTING…';$('connection').classList.remove('online')}
}
poll();setInterval(poll,2500);
setInterval(()=>{if(Date.now()<messageUntil)return;$('headline').textContent=headlines[++headlineIndex%headlines.length]},8500);
</script></body></html>
