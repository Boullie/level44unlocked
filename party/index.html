 // Keep up to 30 approved messages; each message can be shown at most five times.
 const incoming=new Set();
 for(const msg of messages){if(!msg||typeof msg.id!=='string'||!Number.isFinite(msg.at)||Date.now()-msg.at>=MESSAGE_LIFETIME)continue;incoming.add(msg.id);if(!messageCounts.has(msg.id))messageCounts.set(msg.id,0);messagePool.set(msg.id,msg)}
 for(const id of messagePool.keys()){if(!incoming.has(id)){messagePool.delete(id);messageCounts.delete(id)}}
}
function rotateMessage(){
 const available=[...messagePool.values()].filter(m=>(messageCounts.get(m.id)||0)<5);
 if(!available.length){currentMessageId='';showIdlePrompt();lastMessageRotation=Date.now();return}
 const next=available.find(m=>m.id!==currentMessageId)||available[0];
 currentMessageId=next.id;messageCounts.set(next.id,(messageCounts.get(next.id)||0)+1);lastMessageRotation=Date.now();
 const node=$('message');node.classList.add('swap');
 setTimeout(()=>{node.textContent='💬 '+next.name+': '+next.value;node.classList.remove('swap')},300);
 $('headline').textContent='MESSAGE UNLOCKED!';messageUntil=Date.now()+7500;
 if(messageCounts.get(next.id)===1){const toast=$('toast');toast.textContent='★ NEW MESSAGE FROM '+next.name.toUpperCase()+' ★';toast.classList.add('visible');setTimeout(()=>toast.classList.remove('visible'),3000)}
}
messageRotationTimer=setInterval(rotateMessage,8000);showIdlePrompt();lastMessageRotation=Date.now();
async function poll(){
 try{
  const r=await fetch('/.netlify/functions/party',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({op:'feed'}),cache:'no-store'});
  if(!r.ok)throw Error('HTTP '+r.status);
  const data=await r.json();$('connection').textContent='● PARTY ONLINE';$('connection').classList.add('online');
  const events=Array.isArray(data.events)?data.events:[];
  if(!initialized){for(const event of events)seen.add(event.id);initialized=true}
  else{for(const event of events){if(!seen.has(event.id)){seen.add(event.id);effectQueue.push(event.value)}}runNext()}
  if(seen.size>250)seen=new Set(events.map(x=>x.id));
  refreshMessages(Array.isArray(data.messages)?data.messages:[]);if(!lastMessageRotation&&messagePool.size)rotateMessage()
 }catch(e){$('connection').textContent='● RECONNECTING…';$('connection').classList.remove('online')}
}
if(!isPreview){poll();setInterval(poll,2500)}else{const name=previewParams.get('effect')||'confetti';const n=Number(previewParams.get('variant'));renderFilm(filmCatalog[name]?name:'confetti',Number.isInteger(n)&&n>=0&&n<20?n:0);}
setInterval(()=>{if(Date.now()<messageUntil)return;$('headline').textContent=headlines[++headlineIndex%headlines.length]},8500);
</script></body></html>
