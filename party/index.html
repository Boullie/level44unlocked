<!doctype html><html lang="nl-BE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Level 44 — Party TV</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#100525;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}.stars{position:fixed;inset:0;background:radial-gradient(#fff8 1px,transparent 2px) 0 0/65px 65px,linear-gradient(140deg,#13072f,#341065 55%,#0a2b48);animation:move 35s linear infinite}@keyframes move{to{background-position:600px 300px,0 0}}main{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4vh 4vw}h1{font-size:clamp(3rem,9vw,9rem);line-height:1;margin:0;text-shadow:7px 7px #ff3d9a,-5px -5px #2cf8f4;letter-spacing:.04em}h2{font-size:clamp(1.5rem,4vw,3.5rem);color:#ffe46b;margin:3vh 0}.tag{font-weight:900;letter-spacing:.25em;color:#7df7ff}.bottom{position:absolute;bottom:3vh;display:flex;gap:2vw;align-items:center;justify-content:center;width:90%;flex-wrap:wrap}.qr{background:#fff;padding:10px;border-radius:10px;width:135px;height:135px}.box{background:#180a38e8;border:2px solid #ac71ff;border-radius:22px;padding:18px 28px;max-width:75vw}.hint{font-size:clamp(1rem,2vw,1.6rem)}#message{min-height:1.5em;overflow-wrap:anywhere}#effect{position:absolute;top:20%;font-size:clamp(3rem,9vw,7rem);pointer-events:none;animation:pop 1.8s ease-out forwards}@keyframes pop{0%{opacity:0;transform:scale(.3)}20%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:scale(1.8)}}#connection{position:absolute;top:2vh;right:3vw;color:#cbb8ff;font-size:14px}#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}.piece{position:absolute;top:-10%;width:12px;height:20px;animation:fall 3s linear forwards}@keyframes fall{to{transform:translateY(120vh) rotate(850deg);opacity:0}}@media(max-width:600px){.bottom{position:relative;margin-top:25px}.box{max-width:100%}body{overflow:auto}}
</style></head><body><div class="stars"></div><div id="confetti"></div><main><div id="connection">CONNECTING…</div><p class="tag">WELCOME, PLAYER ONE</p><h1>LEVEL 44<br>UNLOCKED!</h1><h2 id="headline">🎂 INSERT CAKE TO CONTINUE 🎂</h2><div class="box"><div class="tag">LIVE PARTY FEED</div><p id="message" class="hint">READY PLAYER 44?</p></div><div id="effect"></div><div class="bottom"><img class="qr" id="qr" alt="QR-code voor Party Controller"><div class="box hint">📱 SCAN &amp; PLAY<br><strong>level44unlocked.netlify.app/party/play/</strong><br><small>Stuur effecten en berichten naar het scherm!</small></div></div></main>
<script>
'use strict';
const base=location.origin+'/party/play/';document.getElementById('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=240x240&data='+encodeURIComponent(base);
const labels={confetti:'🎊 CONFETTI COMBO!',cheer:'📣 CROWD GOES WILD!',dance:'🪩 DANCE MODE!',levelup:'⬆️ LEVEL UP!',heart:'💖 BONUS LOVE!',boss:'👾 BOSS BATTLE!'};
let seen=new Set(),first=true,lastMessage='',activeTimer;
function blast(){const root=document.getElementById('confetti');for(let i=0;i<75;i++){const x=document.createElement('i');x.className='piece';x.style.left=Math.random()*100+'%';x.style.background=['#ff5db1','#7df7ff','#ffe46b','#9d6bff'][i%4];x.style.animationDelay=Math.random()*0.7+'s';root.appendChild(x);setTimeout(()=>x.remove(),4000)}}
function effect(name){const node=document.getElementById('effect');node.textContent=labels[name]||'🎮 BONUS!';node.style.animation='none';void node.offsetWidth;node.style.animation='pop 1.8s ease-out forwards';if(name==='confetti'||name==='levelup')blast()}
async function poll(){try{const r=await fetch('/.netlify/functions/party',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({op:'feed'}),cache:'no-store'});if(!r.ok)throw Error();const data=await r.json();document.getElementById('connection').textContent='🟢 PARTY ONLINE';const events=data.events||[];if(first){events.forEach(x=>seen.add(x.id));first=false}else for(const x of events){if(!seen.has(x.id)){seen.add(x.id);effect(x.value)}}if(seen.size>200)seen=new Set(events.map(x=>x.id));const msg=data.messages?.[0];if(msg&&msg.id!==lastMessage){lastMessage=msg.id;document.getElementById('message').textContent='💬 '+msg.name+': '+msg.value;document.getElementById('headline').textContent='✨ MESSAGE UNLOCKED! ✨'}}catch{document.getElementById('connection').textContent='🟡 RECONNECTING…'}}
poll();setInterval(poll,2500);
const headlines=['🎂 INSERT CAKE TO CONTINUE 🎂','🕹️ NO EXTRA LIVES NEEDED 🕹️','🍻 POWER-UP IN PROGRESS 🍻','👾 44 YEARS OF XP 👾'];let h=0;setInterval(()=>{if(lastMessage)return;document.getElementById('headline').textContent=headlines[++h%headlines.length]},9000);
</script></body></html>
